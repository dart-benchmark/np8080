name: np8080
description: A web based Text editor built with Angular Dart.
version: 0.0.31
homepage: https://github.com/daftspaniel/np8080
author: Davy Mitchell <daftspaniel@gmail.com>
publish_to: none
environment:
  sdk: '>=3.1.0 <4.0.0'
dependencies:
  # Null-safe community fork of AngularDart (package:angular 5 successor).
  ngdart: 8.0.0-dev.4
  ngforms: 5.0.0-dev.3
  intl: ^0.18.1
  # The original pub packages below have no null-safe release, so the exact
  # locked versions are vendored under third_party/ and migrated.
  stringprocess:
    path: third_party/stringprocess
  minibus:
    path: third_party/minibus
  pwa:
    path: third_party/pwa
dev_dependencies:
  # Only used to run the AngularDart template compiler (see build.yaml);
  # the generated *.template.dart files are committed.
  build_runner: ^2.4.13
