name: pwa
description: Progressive Web App library
# Vendored copy of the runtime library (lib/) of package:pwa 0.1.10 (the
# version np8080's lockfile pinned), migrated to null safety and to the
# null-safe package:service_worker 0.4.x so it builds on Dart 3. The
# offline-URL generator CLI (bin/) of the original package is not included.
# Original authors: Istvan Soos and contributors, BSD licensed (see LICENSE).
version: 0.1.10+nullsafety
homepage: https://github.com/isoos/pwa
publish_to: none
environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  service_worker: ^0.4.0
